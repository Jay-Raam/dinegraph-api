services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dinegraph
      POSTGRES_USER: dinegraph
      POSTGRES_PASSWORD: dinegraph-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinegraph -d dinegraph"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
